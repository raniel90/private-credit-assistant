[project]
name = "private-credit-assistant"
version = "0.1.0"
description = "Local private credit assistant with RAG, MCP, streaming chat and access-control demonstrations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0",
  "fastembed>=0.7,<1",
  "fastmcp>=3,<5",
  "httpx>=0.28.1",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
  "langgraph>=1,<2",
  "mcp>=2,<3",
  "pypdf>=5,<7",
  "qdrant-client>=1.20.0",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
